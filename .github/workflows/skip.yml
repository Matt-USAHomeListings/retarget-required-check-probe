name: skip-check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
jobs:
  skip-check:
    name: skip-check
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          mb=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "action=${{ github.event.action }} base=${{ github.base_ref }} merge-base=$mb"
          if git diff "$mb" -- | grep -E '^\+.*BAD2'; then echo "::error::BAD2 found"; exit 1; fi
          echo "no BAD2"
